name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compilar dinput8.dll (x64)
        run: cl /nologo /O2 /LD /Fe:dinput8.dll win_glue.c emu_core.c /link /DEF:dinput8.def
      - uses: actions/upload-artifact@v4
        with:
          name: dinput8-dll
          path: dinput8.dll
